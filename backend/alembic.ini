# Alembic settings. The database address is not here: migrations/env.py reads DATABASE_URL
# (the same variable the API uses), and falls back to the local SQLite file.

[alembic]
script_location = %(here)s/migrations
# files are named 0001_baseline.py, 0002_something.py, ...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# logging, used only when Alembic runs from the command line
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
